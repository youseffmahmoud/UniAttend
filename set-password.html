<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>UniAttend | تعيين كلمة المرور</title><link rel="stylesheet" href="css/login.css"></head>
<body>
<main class="login-container">
  <section class="form-panel" style="grid-column:1/-1;max-width:560px;margin:auto;width:100%">
    <div class="form-heading"><span class="welcome">UniAttend</span><h2>تعيين كلمة المرور</h2><p>اكتب كلمة مرور جديدة لحسابك ثم سجّل الدخول.</p></div>
    <form id="passwordForm">
      <label for="newPassword">كلمة المرور الجديدة</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required>
      <label for="confirmPassword">تأكيد كلمة المرور</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
      <button id="savePasswordButton" type="submit"><span>حفظ كلمة المرور</span><span>←</span></button>
      <p id="passwordMessage" class="message" role="status" aria-live="polite"></p>
    </form>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="js/set-password.js"></script>
</body></html>
